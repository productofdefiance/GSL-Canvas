  Version:  Canvas v51.18 · 2026-10-17, 07:45 UTC
  v51.18: fonts locked. Page titles default to Outfit (--font-title). The
  script that re-applied a saved Lab font choice before the page draws is
  removed: ui.js puts the locked set on <html> on every load (and LabBar

  .gsl-divstrip / .gsl-divchip / .gsl-divbar / .gsl-divtext.

  now), home / away colours (--c-home, --c-away), .gsl-keep.

  .gsl-title), --font-big (big numbers, .gsl-big) and --font-small (small
  numbers: tabular-nums). Playfair Display added. Units styling removed.

  Spartan); big-number spacing 0 / +0.02 / +0.04 / +0.06em; units
  played down (data-units); the score dash is lighter weight only.
  v51.03: lab settings for the score dash and big-number spacing
  (data-dash, data-big-track), and the styles for .gsl-dash / .gsl-wdl.
  v51.01: design tokens, step 1.
   - Fonts: Lexend, Outfit and Atkinson Hyperlegible Next from Google Fonts.
     --font-text is every page's font; --font-num is used by anything with
     lined-up digits (tabular-nums). The Footer switcher picks between them.
   - Colours: every Tailwind colour scale now reads from a CSS variable
     (--c-slate-500 and so on), set to Tailwind's own values, so nothing
     looks different. A palette trial changes these values only.
-->
